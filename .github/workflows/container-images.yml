name: Container Images

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Image channel to publish.
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      tag:
        description: Optional additional Docker tag, for example staging-20260508 or v1.2.3.
        required: false
        type: string
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io
  TRIVY_IMAGE: aquasec/trivy:0.70.0

jobs:
  build-and-push:
    name: Build and Push ${{ matrix.component }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.channel || 'release' }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            context: backend
            dockerfile: backend/Dockerfile
          - component: storefront
            context: storefront
            dockerfile: storefront/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Guard Production Publish
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.channel == 'production' && github.ref_type != 'tag' }}
        run: |
          echo "Production image publishing must be dispatched from a Git tag."
          exit 1

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f7ce87c1d6bead3e36075b2ce75da1f6cc28aaca # v3.9.0

      - name: Login to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Image Metadata
        id: meta
        shell: bash
        env:
          COMPONENT: ${{ matrix.component }}
          INPUT_CHANNEL: ${{ github.event.inputs.channel }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          image="${REGISTRY}/${repository}/${COMPONENT}"
          short_sha="${GITHUB_SHA::12}"
          primary_tag="${image}:sha-${short_sha}"

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            channel="${INPUT_CHANNEL:-staging}"
            requested_tag="${INPUT_TAG:-}"
          else
            channel="production"
            requested_tag="${GITHUB_REF_NAME}"
          fi

          if [[ "${channel}" == "production" && -z "${requested_tag}" && "${GITHUB_REF_TYPE}" == "tag" ]]; then
            requested_tag="${GITHUB_REF_NAME}"
          fi

          if [[ -n "${requested_tag}" && ! "${requested_tag}" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Invalid Docker tag: ${requested_tag}"
            exit 1
          fi

          {
            echo "tags<<EOF"
            echo "${primary_tag}"
            if [[ -n "${requested_tag}" ]]; then
              echo "${image}:${requested_tag}"
            fi
            echo "${image}:${channel}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

          echo "primary_tag=${primary_tag}" >> "${GITHUB_OUTPUT}"

          {
            echo "labels<<EOF"
            echo "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}"
            echo "org.opencontainers.image.revision=${GITHUB_SHA}"
            echo "org.opencontainers.image.title=dz-saas-commerce-${COMPONENT}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Build Image
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
          sbom: true
          provenance: true

      - name: Pull Image for Scan
        run: docker pull "${{ steps.meta.outputs.primary_tag }}"

      - name: Scan Image
        run: scripts/security/container-image-scan.sh "${{ steps.meta.outputs.primary_tag }}"

      - name: Sign Image with Cosign
        if: github.event_name == 'push' || github.event.inputs.channel == 'production'
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0
        with:
          cosign-release: 'v2.4.1'

      - name: Sign and Attest
        if: github.event_name == 'push' || github.event.inputs.channel == 'production'
        run: |
          cosign sign --yes "${{ steps.meta.outputs.primary_tag }}"

          # Generate SLSA provenance predicate using printf to avoid YAML parsing issues
          printf '{\n  "buildType": "https://github.com/slsa-framework/slsa-github-generic-generator/docker@v1",\n  "builder": { "id": "https://github.com/actions/runner" },\n  "invocation": {\n    "configSource": {\n      "uri": "git+https://github.com/${GITHUB_REPOSITORY}",\n      "digest": { "sha1": "${GITHUB_SHA}" },\n      "entryPoint": ".github/workflows/container-images.yml"\n    }\n  },\n  "metadata": {\n    "buildInvocationId": "${GITHUB_RUN_ID}",\n    "buildStartedOn": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"\n  },\n  "materials": [\n    {\n      "uri": "git+https://github.com/${GITHUB_REPOSITORY}",\n      "digest": { "sha1": "${GITHUB_SHA}" }\n    }\n  ]\n}' > /tmp/provenance.json

          cosign attest --yes \
            --predicate-type=https://slsa.dev/provenance/v1 \
            --predicate=/tmp/provenance.json \
            "${{ steps.meta.outputs.primary_tag }}"

